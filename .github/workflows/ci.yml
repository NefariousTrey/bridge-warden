# Tests on Linux, Windows and macOS. Standard library app; pytest + Node only for the test run.
# No secrets are used: the live PayPal / xAI tests skip themselves without keys.
name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test tools
        run: python -m pip install -r requirements-dev.txt
      - name: Tests (warn on any file read without utf-8)
        run: python -X warn_default_encoding -m pytest -q -p no:cacheprovider
      - name: Self-check and dry-run demo
        run: |
          python -m bridge_warden selfcheck
          python -m bridge_warden --audit ci-audit/audit.jsonl demo
