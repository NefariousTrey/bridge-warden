# Render blueprint for the Bridge Warden JUDGE DEMO (practice data only).
# Moved here 2026-10-26 (copy of the old root render.yaml; backup render.yaml.bak-20261026-render). The root
# render.yaml is now the self-host "Deploy to Render" Blueprint. To use THIS file, set Render's "Blueprint Path"
# to render-judge.yaml (https://render.com/docs/infrastructure-as-code, Setup step 7).
# Not deployed. Nobody has signed up. Trey decides if and when to use it.
# Do NOT add PayPal, xAI, Twilio, Channel3 or webhook secrets here: judge mode refuses to start if any are set.
services:
  - type: web
    name: bridge-warden-judge-demo
    runtime: python
    plan: free
    region: oregon   # Render's default region, same as the live demo
    # Standard library only. AG Studio is fetched ONLY if BW_AG_STUDIO_LICENSE_KEY is set (the key is never echoed).
    buildCommand: 'python --version && if [ -n "${BW_AG_STUDIO_LICENSE_KEY:-}" ]; then bash scripts/fetch_ag_studio.sh || echo "AG Studio not fetched (optional)"; fi'
    startCommand: "python -m bridge_warden judge --public"
    healthCheckPath: /healthz
    autoDeployTrigger: "off"           # current syntax (was autoDeploy: false, now deprecated)
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
